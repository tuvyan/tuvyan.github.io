name: Update TUVYAN full-text search index

on:
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - '!studio/**'
      - '!search/**'
      - 'scripts/build_search_index.py'
      - '.github/workflows/update-search-index.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tuvyan-search-index
  cancel-in-progress: false

jobs:
  rebuild-index:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install HTML parser
        run: python -m pip install 'beautifulsoup4>=4.12,<5'
      - name: Generate search index
        run: python scripts/build_search_index.py
      - name: Commit changed index only
        run: |
          if git diff --quiet -- search/fulltext-index.json; then
            echo 'Search index already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add search/fulltext-index.json
          git commit -m 'Update TUVYAN full-text search index'
          git push
