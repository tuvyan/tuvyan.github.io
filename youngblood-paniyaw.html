</style><style id="tuvyan-phase3-title">main > h1{font-size:clamp(2rem,4.5vw,3.2rem)!important;line-height:1.18!important;overflow-wrap:break-word;letter-spacing:normal!important;margin-bottom:.65em}main .content{overflow-wrap:anywhere}main .content img{max-width:100%;height:auto}</style><style id="tuvyan-editor-layout-v2">figure.tuvyan-wrap-left,img.tuvyan-wrap-left,.tuvyan-crop-frame.tuvyan-wrap-left{float:left;clear:left;margin:.35em 1.2em .7em 0!important;max-width:48%}figure.tuvyan-wrap-right,img.tuvyan-wrap-right,.tuvyan-crop-frame.tuvyan-wrap-right{float:right;clear:right;margin:.35em 0 .7em 1.2em!important;max-width:48%}@media(max-width:600px){figure.tuvyan-wrap-left,figure.tuvyan-wrap-right,img.tuvyan-wrap-left,img.tuvyan-wrap-right,.tuvyan-crop-frame.tuvyan-wrap-left,.tuvyan-crop-frame.tuvyan-wrap-right{float:none!important;display:block;width:100%!important;max-width:100%!important;margin:1em auto!important}}</style></head><body><nav aria-label="Article navigation" class="tuvyan-article-nav"><a href="./">← Homepage</a><a href="./?category=heritage#archive">↑ Vanaw Heritage</a><a href="ullalim-sogsogna.html">← Previous</a><a href="more-documents-about-the-vanaw.html">Next →</a></nav><header><a href="index.html"><strong>TUVYAN</strong></a><a href="index.html#archive">Articles &amp; Publications</a><a href="index.html#categories">Explore</a></header><main><p class="note">TUVYAN · WORDS · CULTURE · HERITAGE</p><h2><strong>Paniyáw</strong></h2><div class="content"><figure>by Scott Magkachi Saboy</figure><figure><img alt="" src="https://assets.zyrosite.com/cdn-cgi/image/format=auto,w=650,h=433,fit=crop/YanB3E2v3Jtj2x9l/paniyaw-2-m2W4x1lkn2FVxoeK.png">*Originally published in the "Youngblood" section of the <em>Philippine Daily Inquirer</em>, 01.08.2000</figure><figure><p class="MsoNormal" style="margin: 0px; color: rgb(34, 34, 34); font-family: Arial, Helvetica, sans-serif; font-size: small; text-align: justify;"><font size="3" face="Book Antiqua"><span style="font-size: 12pt;">“Meri Krismas,” the emaciated fellow grunted as he flashed an ID bearing the seal of the Department of Social Welfare and Development (DSWD). He had lost his home when <u></u><u></u>Mt.<u></u> <u></u>Pinatubo<u></u><u></u> erupted and he had no family to turn to for help, he said.<u></u><u></u></span></font></p><p class="MsoNormal" style="margin: 0px; color: rgb(34, 34, 34); font-family: Arial, Helvetica, sans-serif; font-size: small; text-align: justify;"><font size="3" face="Book Antiqua"><span style="font-size: 12pt;"><u></u>&nbsp;<u></u></span></font></p><p class="MsoNormal" style="margin: 0px; color: rgb(34, 34, 34); font-family: Arial, Helvetica, sans-serif; font-size: small; text-align: justify;"><font size="3" face="Book Antiqua"><span style="font-size: 12pt;">After glancing at the ID and seeing the pitiful look on the man’s face, my friend handed him a P10 bill.<u></u><u></u></span></font></p><p class="MsoNormal" style="margin: 0px; color: rgb(34, 34, 34); font-family: Arial, Helvetica, sans-serif; font-size: small; text-align: justify;"><font size="3" face="Book Antiqua"><span style="font-size: 12pt;"><u></u>&nbsp;<u></u></span></font></p><p class="MsoNormal" style="margin: 0px; color: rgb(34, 34, 34); font-family: Arial, Helvetica, sans-serif; font-size: small; text-align: justify;"><font size="3" face="Book Antiqua"><span style="font-size: 12pt;">That was sometime time.&nbsp; I thought that if I were alone with that man at the time, I wouldn’t have minded digging out P5 from my pocket and giving it to him even if that was all the money I had that day.<u></u><u></u></span></font></p><p class="MsoNormal" style="margin: 0px; color: rgb(34, 34, 34); font-family: Arial, Helvetica, sans-serif; font-size: small; text-align: justify;"><font size="3" face="Book Antiqua"><span style="font-size: 12pt;"><u></u>&nbsp;<u></u></span></font></p><p class="MsoNormal" style="margin: 0px; color: rgb(34, 34, 34); font-family: Arial, Helvetica, sans-serif; font-size: small; text-align: justify;"><font size="3" face="Book Antiqua"><span style="font-size: 12pt;">But watching two kids doing a jig while banging their little gongs to the amusement of two lovers a few days later, I vowed never to give them even one centavo.&nbsp; I remembered that a few Decembers ago right in the same park, a group of old people did the same thing before my mom, and all they got from her was an angry reprimand for using a rusty pan in place of the usual&nbsp; bronze gong used in some social activities among indigenous peoples in the Cordillera region.<u></u><u></u></span></font></p><p class="MsoNormal" style="margin: 0px; color: rgb(34, 34, 34); font-family: Arial, Helvetica, sans-serif; font-size: small; text-align: justify;"><font size="3" face="Book Antiqua"><span style="font-size: 12pt;"><u></u>&nbsp;<u></u></span></font></p><p class="m_6104743683954762565MsoBodyText" style="margin: 0in 0in 0.0001pt; text-align: justify; font-size: 12pt; font-family: &quot;Times New Roman&quot;; color: rgb(34, 34, 34);"><font size="3" face="Book Antiqua"><span style="font-size: 12pt;">But why must our blood rise over such things?&nbsp; Certainly it is not because we want to spoil their fun; it is just that we feel there’s no fun in seeing something wrong.&nbsp; It is not because we choose to be cold when everybody’s heart is warm; it is just that we think charity must not encourage a bad practice.&nbsp; It is not that we despise the Igorots, for we are full-blooded Igorots ourselves (FBIs, if you please), and we are mighty proud to be so.<u></u><u></u></span></font></p><p class="MsoNormal" style="margin: 0px; color: rgb(34, 34, 34); font-family: Arial, Helvetica, sans-serif; font-size: small; text-align: justify;"><font size="3" face="Book Antiqua"><span style="font-size: 12pt;"><u></u>&nbsp;<u></u></span></font></p><p class="MsoNormal" style="margin: 0px; color: rgb(34, 34, 34); font-family: Arial, Helvetica, sans-serif; font-size: small; text-align: justify;"><font size="3" face="Book Antiqua"><span style="font-size: 12pt;">You see, the <i>tadjók</i> or <i>tadék </i>is our native dance. It was never meant to be used as an aid for begging.&nbsp; It is, as we say in Kalinga, <i><span class="il"><span class="il"><span class="il">paniyaw</span></span></span> </i>[taboo] to do so.<u></u><u></u></span></font></p><p class="MsoNormal" style="margin: 0px; color: rgb(34, 34, 34); font-family: Arial, Helvetica, sans-serif; font-size: small; text-align: justify;"><font size="3" face="Book Antiqua"><span style="font-size: 12pt;"><u></u>&nbsp;<u></u></span></font></p><p class="MsoNormal" style="margin: 0px; color: rgb(34, 34, 34); font-family: Arial, Helvetica, sans-serif; font-size: small; text-align: justify;"><font size="3" face="Book Antiqua"><span style="font-size: 12pt;">Yes, it is meant for entertainment, but not of the kind that was exhibited in the 1904 St. Louis Exposition when people who looked at ethnic culture with jaundiced eyes came to gawk at and make fun of the “wild man’s way of life.”&nbsp; It is not meant to reinforce a twisted view of our culture, but to encourage other people to understand and appreciate a culture different from theirs.&nbsp; It is never meant to put our people in a bad light because it is an art form that projects beauty.<u></u><u></u></span></font></p><p class="MsoNormal" style="margin: 0px; color: rgb(34, 34, 34); font-family: Arial, Helvetica, sans-serif; font-size: small; text-align: justify;"><font size="3" face="Book Antiqua"><span style="font-size: 12pt;"><u></u>&nbsp;<u></u></span></font></p><p class="MsoNormal" style="margin: 0px; color: rgb(34, 34, 34); font-family: Arial, Helvetica, sans-serif; font-size: small; text-align: justify;"><font size="3" face="Book Antiqua"><span style="font-size: 12pt;">That is why I do not feel the thrill of youngsters at <u></u><u></u>Burnham<u></u> <u></u>Park<u></u><u></u> watching my fellow highlanders prance to the uncertain beat of plates.&nbsp; I feel insulted when lowlanders point at them and spit out the word “Igorot” with some amusement.<u></u><u></u></span></font></p><p class="MsoNormal" style="margin: 0px; color: rgb(34, 34, 34); font-family: Arial, Helvetica, sans-serif; font-size: small; text-align: justify;"><font size="3" face="Book Antiqua"><span style="font-size: 12pt;"><u></u>&nbsp;<u></u></span></font></p><p class="MsoNormal" style="margin: 0px; color: rgb(34, 34, 34); font-family: Arial, Helvetica, sans-serif; font-size: small; text-align: justify;"><font size="3" face="Book Antiqua"><span style="font-size: 12pt;">I don’t feel happy when I see “Igorot kids” begging, with a symbol of my culture hanging from their hands.&nbsp; I feel pity for them because their parents did not teach them to value their heritage.&nbsp; I pity them because they will grow up thinking that the <i>pattong</i> [gong] is only meant to be beaten in exchange of a few centavos!&nbsp; Perhaps, they will never know that in the gong they have a legacy to cherish and protect.&nbsp; For what is there to protect and cherish&nbsp; if there’s nothing to value?&nbsp; What is there to value in ignorance?<u></u><u></u></span></font></p><p class="MsoNormal" style="margin: 0px; color: rgb(34, 34, 34); font-family: Arial, Helvetica, sans-serif; font-size: small; text-align: justify;"><font size="3" face="Book Antiqua"><span style="font-size: 12pt;"><u></u>&nbsp;<u></u></span></font></p><p class="MsoNormal" style="margin: 0px; color: rgb(34, 34, 34); font-family: Arial, Helvetica, sans-serif; font-size: small; text-align: justify;"><font size="3" face="Book Antiqua"><span style="font-size: 12pt;">Oh, you should have seen the innocence on the faces of those kids.&nbsp; It could have made the proudest Igorot weep.<u></u><u></u></span></font></p><p class="MsoNormal" style="margin: 0px; color: rgb(34, 34, 34); font-family: Arial, Helvetica, sans-serif; font-size: small; text-align: justify;"><font size="3" face="Book Antiqua"><span style="font-size: 12pt;"><u></u>&nbsp;<u></u></span></font></p><p class="MsoNormal" style="margin: 0px; color: rgb(34, 34, 34); font-family: Arial, Helvetica, sans-serif; font-size: small; text-align: justify;"><font size="3" face="Book Antiqua"><span style="font-size: 12pt;">“Come on, there’s no reason to fuss over such a trivial thing!” a friend once told me.&nbsp; Ah, yes, they laugh at tears that never had dust in the eye (my apologies to Shakespeare).<u></u><u></u></span></font></p><p class="MsoNormal" style="margin: 0px; color: rgb(34, 34, 34); font-family: Arial, Helvetica, sans-serif; font-size: small; text-align: justify;"><font size="3" face="Book Antiqua"><span style="font-size: 12pt;"><u></u>&nbsp;<u></u></span></font></p><p class="MsoNormal" style="margin: 0px; color: rgb(34, 34, 34); font-family: Arial, Helvetica, sans-serif; font-size: small; text-align: justify;"><font size="3" face="Book Antiqua"><span style="font-size: 12pt;">Like it or not, whatever impression these fellow Igorots make on others would be to the “outsider” reflective of the whole Igorot people.&nbsp; Is it any wonder that many lowlanders think that begging with a gong is all that it takes to be an Igorot?&nbsp; Or that an Igorot is simply a camera-loving old man wearing a colorful native garb with a scary headdress?&nbsp; (I even have friends who once wondered whether I was a genuine Igorot because they had not seen me in a leather jacket, tattered jeans and cowboy boots!)<u></u><u></u></span></font></p><p class="MsoNormal" style="margin: 0px; color: rgb(34, 34, 34); font-family: Arial, Helvetica, sans-serif; font-size: small; text-align: justify;"><font size="3" face="Book Antiqua"><span style="font-size: 12pt;"><u></u>&nbsp;<u></u></span></font></p><p class="MsoNormal" style="margin: 0px; color: rgb(34, 34, 34); font-family: Arial, Helvetica, sans-serif; font-size: small; text-align: justify;"><font size="3" face="Book Antiqua"><span style="font-size: 12pt;">This reminds me of a Manileña who was taking a Dangwa bus to somewhere.&nbsp; While waiting for the junk to roar off, she stood by her seat and told her male companion, “Gusto kong makakita ng Igorot” [I want to see an Igorot].&nbsp; To bad for her, my sister who was just a few seats away overheard her remark. My sister told her: <i>“Hindi mo ba alam na halos lahat ng mga nakikita mong tao sa loob ng</i> bus <i>ay mga Igorot</i>?” [Don’t you know that almost all folks seated in this bus are Igorots?]<u></u><u></u></span></font></p><p class="MsoNormal" style="margin: 0px; color: rgb(34, 34, 34); font-family: Arial, Helvetica, sans-serif; font-size: small; text-align: justify;"><font size="3" face="Book Antiqua"><span style="font-size: 12pt;"><u></u>&nbsp;<u></u></span></font></p><p class="MsoNormal" style="margin: 0px; color: rgb(34, 34, 34); font-family: Arial, Helvetica, sans-serif; font-size: small; text-align: justify;"><font size="3" face="Book Antiqua"><span style="font-size: 12pt;">I didn’t know what happened after that, but I can imagine the rest of the “native” passengers nodding their heads and muttering, “Now she knows.”<u></u><u></u></span></font></p><p class="MsoNormal" style="margin: 0px; color: rgb(34, 34, 34); font-family: Arial, Helvetica, sans-serif; font-size: small; text-align: justify;"><font size="3" face="Book Antiqua"><span style="font-size: 12pt;"><u></u>&nbsp;<u></u></span></font></p><p class="MsoNormal" style="margin: 0px; color: rgb(34, 34, 34); font-family: Arial, Helvetica, sans-serif; font-size: small; text-align: justify;"><font size="3" face="Book Antiqua"><span style="font-size: 12pt;">But I think that lady should not be blamed for her ignorance or prejudice.&nbsp; Perhaps, back in <u></u>Manila<u></u> she had heard friends who visited <u></u>Baguio<u></u> describe those curiously dressed people posing for a fee at the Botanical Garden or <u></u><u></u>Wright<u></u> <u></u>Park<u></u><u></u>.&nbsp; Perhaps she had even seen pictures of these “cute” highlanders.&nbsp; And she must have thought how wonderful it would be to have her pictures taken with the unschooled fellows.&nbsp; And to think it would cost her only a few pesos!&nbsp; And we highlanders wonder why some lowlanders can be so prejudiced against us?<u></u><u></u></span></font></p><p class="MsoNormal" style="margin: 0px; color: rgb(34, 34, 34); font-family: Arial, Helvetica, sans-serif; font-size: small; text-align: justify;"><font size="3" face="Book Antiqua"><span style="font-size: 12pt;"><u></u>&nbsp;<u></u></span></font></p><p class="MsoNormal" style="margin: 0px; color: rgb(34, 34, 34); font-family: Arial, Helvetica, sans-serif; font-size: small; text-align: justify;"><font size="3" face="Book Antiqua"><span style="font-size: 12pt;">Oh yes, we can always declare that we can match their superiority complex. Or that we can always say with much enthusiasm that we feel superior to them since “we are a people who daily touch the earth and sky,” or “we have never been conquered by any colonial power.”&nbsp; But such claims are not going to add enlightenment to some darkened perceptions so long as we allow our own people to think and act like they were worth only a few hundred centavos!</span></font></p></figure></div></main><nav aria-label="Article navigation" class="tuvyan-article-nav"><a href="./">← Homepage</a><a href="./?category=heritage#archive">↑ Vanaw Heritage</a><a href="ullalim-sogsogna.html">← Previous</a><a href="more-documents-about-the-vanaw.html">Next →</a></nav><footer><a href="index.html">← Back to TUVYAN homepage</a></footer><div id="tuvyan-guest-comments"></div><script defer="" src="/guest-comments/comments.js"></script>
